name: e2e

# 冒烟 E2E（macOS 嵌入式 WebDriver）。仅手动触发：macOS runner 按 10 倍费率
# 计分钟且含 Rust 构建，不挂在每次 push 上烧额度。需要时：
#   gh workflow run e2e.yml
# 或 Actions 页面 → e2e → Run workflow。本地无 Rust 跑不了，CI 专供。
on:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      # debug 构建（含 tauri-plugin-wdio-webdriver），--no-bundle 跳过 dmg 打包
      - run: npm run tauri build -- --debug --no-bundle
      - run: npm run test:e2e
      # 排障：若报 wdio-webdriver ACL 相关错误，需在构建前注入
      # capabilities/wdio.json（wdio-webdriver:default），release 构建不含此文件
