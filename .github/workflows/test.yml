name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Linux 1x 计费（macOS 是 10x）；测试无平台依赖，无需 macOS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
