[package]
name = "order-tracker"
version = "0.1.0"
description = "Personal daigou + stock order tracker"
authors = ["Cloudiiink"]
edition = "2021"

[lib]
name = "order_tracker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
